<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGuard - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-card {
            max-width: 450px;
            margin: 4rem auto;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand text-info fw-bold" href="index.html"><i class="bi bi-shield-check me-2"></i>ExamGuard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link active" href="login.html">Login</a>
                <a class="nav-link" href="signup.html">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card auth-card p-4 bg-white shadow-sm">
            <div class="text-center mb-4">
                <div class="bg-primary text-white d-inline-flex p-3 rounded-circle mb-2"><i class="bi bi-lock-fill fs-4"></i></div>
                <h4 class="fw-bold">Welcome Back</h4>
                <p class="text-muted small">Sign in to access your ExamGuard portal</p>
            </div>
            <form action="faculty-dashboard.html">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email / Roll Number</label>
                    <input type="text" class="form-control" placeholder="e.g. bsef24m040@pucit.edu.pk" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small" for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="small text-decoration-none">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Sign In</button>
            </form>
            <hr class="my-4">
            <div class="text-center small">
                Don't have an account? <a href="signup.html" class="text-decoration-none fw-bold">Sign Up</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
