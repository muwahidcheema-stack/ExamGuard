<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamGuard - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .auth-card {
            max-width: 550px;
            margin: 3rem auto;
            border: 1px solid #e2e8f0;
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
        <div class="container-fluid">
            <a class="navbar-brand text-info fw-bold" href="index.html"><i class="bi bi-shield-check me-2"></i>ExamGuard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="login.html">Login</a>
                <a class="nav-link active" href="signup.html">Sign Up</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card auth-card p-4 bg-white shadow-sm">
            <div class="text-center mb-4">
                <div class="bg-success text-white d-inline-flex p-3 rounded-circle mb-2"><i class="bi bi-person-plus-fill fs-4"></i></div>
                <h4 class="fw-bold">Create an Account</h4>
                <p class="text-muted small">Register as a Faculty Member or Teaching Assistant (TA)</p>
            </div>
            <form action="faculty-dashboard.html">
                <div class="row g-3 mb-3">
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" class="form-control" placeholder="Muhammad Muahid Cheema" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Employee / Roll No.</label>
                        <input type="text" class="form-control" placeholder="BSEF24M040" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Department</label>
                        <select class="form-select" required>
                            <option value="">Select Department...</option>
                            <option value="SE">Software Engineering</option>
                            <option value="CS">Computer Science</option>
                            <option value="IT">Information Technology</option>
                        </select>
                    </div>
                    <div class="col-md-12">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" placeholder="name@pucit.edu.pk" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Role</label>
                        <select class="form-select" required>
                            <option value="TA">Teaching Assistant (TA)</option>
                            <option value="Faculty">Faculty Member</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Register Account</button>
            </form>
            <hr class="my-4">
            <div class="text-center small">
                Already registered? <a href="login.html" class="text-decoration-none fw-bold">Sign In</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
